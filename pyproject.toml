[project]
name = "escher-coloring"
version = "0.1.0"
description = "Automatic Escher tiling and coloring (Gethner's algorithm) with an interactive demo"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "shapely",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "playwright"]
gen = ["torch", "diffusers", "transformers", "accelerate", "safetensors"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["escher", "server"]
